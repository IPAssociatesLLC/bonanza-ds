[project]
name = "bonanza-ds"
version = "0.1.0"
description = "Bonanza DS - Drop Shipping Automation Platform for Bonanza Marketplace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "httpx==0.28.1",
    "python-multipart==0.0.22",
    "watchfiles==1.1.1",
    "sqlalchemy>=2.0.50",
    "psycopg2-binary>=2.9.12",
    "google-genai>=2.8.0",
    "pydantic>=2.12.5",
    "scrapfly-sdk>=0.11.1",
    "parsel>=1.8.1",
    "jmespath>=1.0.1",
    "loguru>=0.7.3",
]

[tool.uv]
exclude-newer = "14 days"
# workshop-connect is published by us; exempt from the rolling window.
exclude-newer-package = { workshop-connect = "2027-01-01" }
