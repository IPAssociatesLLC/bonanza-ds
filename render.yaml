services:
  - type: web
    name: bonanza-ds-platform
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bonanza-ds-db
          property: connectionString
      - key: PORT
        value: "8000"

databases:
  - name: bonanza-ds-db
    plan: free
    databaseName: bonanza
    user: bonanza_user
